# Tiamat Default Magic — the Hermetic Art: the magic door of Progress's
# Fork, and everything behind it (docs/brief.md).
#
# Built: the Apothecary's Bench (brief §4), the Emerald Tablet's door, and
# the whole tree behind it, tiers 3 to 7 (brief §17).
id = "tiamat_default_magic"
name = "Tiamat Default Magic"
version = "1.0.0"
description = "The Hermetic Art: the athanor, the Twelve Gates, spagyrics, elementals and the Philosophers' Stone."
license = "GPL-3.0-only"
# Without any of these there is no Art to practise: the world's plants and
# ores, Life's food and fire, Craft's recipes and stations, Progress's nodes
# and door. Hard, so a server missing one says so instead of loading a mod
# that can do nothing (brief §2.1).
depends = [
  "core >=0.1",
  "tiamat_default_world >=0.1",
  "tiamat_default_life >=0.1",
  "tiamat_default_craft >=0.5",
  "tiamat_default_progress >=0.1",
]
# Loaded after these when they are here, so `game.exports` finds them from
# init.lua's first line. Without the interface the Mute Book is a plain
# dialog; without the weather, nothing at the Bench changes.
optional_depends = ["tiamat_default_ui", "tiamat_weather"]

[[world_option]]
id = "transmutation"
name = "Transmutation"
description = "May the Stones make silver and gold? Off: they still heal and still open the Great Arcanum, but projection makes nothing."
default = 1

[[world_option]]
id = "woven_worlds"
name = "Woven worlds per player"
description = "How many worlds each Adept may weave and keep at once (the Opus Mundi)."
options = ["1", "2", "4"]
default = 1

# NO `[theme]` HERE, ON PURPOSE. The engine wears the LAST theme in load
# order, and the interface mod owns the look.
